name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: 6.x-dev
      # Rebuild the class/config manifest before the suite runs, so test classes
      # in freshly installed modules are resolvable (SapphireTest needs them to
      # locate fixture files).
      SS_PHPUNIT_FLUSH: 1
    services:
      # The silvershop suites are ORM tests: SapphireTest builds a temp database
      # for each one. silverstripe/framework's test bootstrap defaults to MySQL
      # on 127.0.0.1 as root with an empty password, which is what this matches.
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Validate composer file
        run: composer validate --no-check-publish

      # No --prefer-dist: the silvershop packages mark /tests as export-ignore,
      # so a dist install has no test suites to run. preferred-install in
      # composer.json pulls those from source and everything else from dist.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run SilverShop test suite
        run: vendor/bin/phpunit

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: 4.x-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none

      - name: Validate composer file
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run SilverShop test suite
        run: vendor/bin/phpunit --bootstrap vendor/silverstripe/cms/tests/bootstrap.php vendor/silvershop
